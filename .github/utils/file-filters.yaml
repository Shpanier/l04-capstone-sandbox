# Which files belong to which service. Read by dorny/paths-filter: a service is
# tested (and built) only when one of its files changed.
# The name of each filter is the path of the service, so the list of changed
# filters is also the list of folders to test.

services/python/grades-api:
  - "services/python/grades-api/**"
  - ".github/actions/setup-service/**"

services/python/grades-report:
  - "services/python/grades-report/**"
  - ".github/actions/setup-service/**"

services/web/grades-web:
  - "services/web/grades-web/**"
  - ".github/actions/setup-service/**"
